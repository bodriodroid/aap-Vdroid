name: Makefile source checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Prepare patched app sources
      run: |
        git -C external/vital apply --check ../../apps/vitaloid-aap.patch
        make copy-and-patch-app-sources
    - name: Check JUCE compatibility patches
      run: |
        git -C external/JUCE apply --check ../../juce-6.1.4-diff-vital-modules.patch
        make patch-juce-modules patch-juce-sources
